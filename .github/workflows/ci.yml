name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# There is deliberately NO dependency-install step.
#
# The zero-dependency rule is enforced structurally rather than by policy: adding a package makes the
# build fail here rather than passing unnoticed. A rule that only lives in documentation is a rule
# until the first inconvenience.
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      # Guards run BEFORE the verdict, in this order, so a broken guard fails the build before a
      # verdict can be rendered from it. A verdict computed on unverified inputs is worse than no
      # verdict, because it carries the authority of having been checked.

      - name: Source inventory
        run: npm run inventory

      - name: Source fidelity
        run: npm run fidelity

      - name: Cross-references
        run: npm run links

      - name: Policy shape
        run: npm run policy

      - name: Financial mathematics
        run: npm run math

      - name: Tests
        run: npm test

      # Evidence, then verdict. audit is deliberately NOT run with --strict: a step that fails on
      # advisory findings is a step someone eventually deletes, and a deleted step checks nothing.
      - name: Audit the published analyses
        run: npm run audit

      - name: Check this repository against its own policy
        run: npm run check

      # One step remains disabled until its subject exists:
      #
      #   diagrams  — Milestone 5, once docs/architecture.mmd exists
      #
      # SCOPE OF audit AND check. Both target examples/compliant — the analysis documents this
      # repository publishes as its own work — rather than every markdown file it contains. Two
      # categories are excluded and neither goes unchecked:
      #
      #   standards/*.md          normative documents, not analyses. Standard 1's modes do not apply
      #                           to a standard, so auditing one is a category error that produces
      #                           findings nobody can act on. They are covered by inventory,
      #                           fidelity, links, and math instead.
      #   examples/violations/    deliberately non-compliant known-positive fixtures. Including them
      #                           would make the verdict permanently BLOCKED_BY_INVARIANT, which is
      #                           not honesty but noise. test/examples.test.mjs asserts every one
      #                           fires its manifest, so repairing a fixture breaks a test.
