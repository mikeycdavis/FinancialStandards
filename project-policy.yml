# Project policy for the FinancialStandards repository itself.
#
# This repository is its own first adopter, so this file is the pattern every adopting project will
# copy — including its mistakes. Four rules govern what may appear here:
#
#   * Rule IDs are canonical only (ADR 0001). No camelCase; the schema rejects it.
#   * `applicability` and `exceptions` are different mechanisms and never substitute for each other.
#       not-applicable = the rule has no subject in this project.
#       exception      = the rule applies and this project knowingly does not satisfy it.
#   * An attestation is EVIDENCE, not a waiver. It never overrides an automated finding, and it goes
#     stale on its own when what it reviewed changes.
#   * Nothing here asserts compliance. What this project actually meets is the output of
#     `standards check`, not a claim made in its own configuration.
#
# Shape: schemas/project-policy.schema.json. Reasoning: artifacts/adr/0005-concept-disposition.md.

standardVersion: "1.0.0"
project: "FinancialStandards"

# No rule-level overrides. Every one of the 95 catalogued rules takes its framework default here,
# which is the correct state for a project that has not had reason to differ from one — and the
# honest state for the repository that authored them.

# Rules whose subject does not exist in this repository. Each is a claim about THIS PROJECT, not
# about the rule, and stops being true the moment the project gains the capability — hence
# `revisitWhen`.
#
# Empty, and that is a claim worth examining rather than a default. The obvious candidate is
# risk.sequence-risk-addressed, whose subject — an analysis modelling withdrawals — is absent from
# two of the three analyses published here. It is deliberately NOT declared not-applicable: the
# detector already reports NOT_EVALUATED for those documents, which is the accurate state, and a
# blanket project-level declaration would also cover debt-vs-invest-analysis.md, which does model
# cash flows. A not-applicable claim that is true of most documents and false of one is exactly the
# kind of convenient approximation this mechanism exists to prevent.
#
# The key is omitted rather than written as an empty mapping because scripts/yaml.mjs rejects flow
# collections outright rather than guessing at them. That strictness is deliberate and is the parser
# working as intended: a policy is a document whose exact meaning matters, and a parser that accepts
# two spellings of nothing will eventually accept two spellings of something. These comments are
# what stop an omitted section from reading as an overlooked one.

# No exceptions. Every rule that applies here is either met, failing, or honestly unevaluated, and a
# failing rule is reported as a failure rather than waived.
#
# A waiver against any of the five non-exemptible rules is rejected rather than honoured, and yields
# BLOCKED_BY_INVARIANT (ADR 0006). That is not a reason to avoid recording a genuine exception — it
# is a reason that the four fabrication-and-guarantee prohibitions and integrity.no-weakening can
# never be one.
exceptions: []

# Recorded human judgement for rules the catalog says a human evaluates.
#
# Empty, and this is the most important empty section in the file. Several prohibitions here can only
# ever be established by a person: no scan determines whether market data, account data, or a tax
# rule was fabricated. Until a human reviews and records that judgement, those rules are
# NOT_EVALUATED — which is a distinct state from compliant, and must never be rounded up to one
# because an automated run found nothing.
